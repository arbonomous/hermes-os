<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HermesOS — First Boot (preview)</title>
<style>
  :root{--bg:#0b0e14;--panel:#121620;--ink:#e6e9ef;--dim:#8b93a7;--accent:#4cc2ff;--accent2:#7ee787;--warn:#ff9b6b;--line:#222a3a}
  *{box-sizing:border-box}html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 800px at 50% -10%, #16203a 0%, var(--bg) 60%);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100%;padding:24px}
  .wrap{width:min(680px,94vw)}
  .badge{color:var(--dim);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
  .frame{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.45);min-height:360px;display:flex;flex-direction:column}
  .title{font-size:22px;font-weight:650;margin:0 0 14px}
  .body{white-space:pre-wrap;color:var(--ink);margin:0 0 18px;flex:1}
  .opts{list-style:none;padding:0;margin:0 0 16px}
  .opts li{padding:9px 12px;border-radius:9px;color:var(--dim);margin:4px 0}
  .opts li.sel{background:rgba(76,194,255,.14);color:var(--ink);border:1px solid rgba(76,194,255,.4)}
  .opts li .d{color:var(--accent2);font-size:13px;display:block;margin-top:2px}
  .input{margin:6px 0 16px}
  .input label{color:var(--dim);font-size:13px;display:block;margin-bottom:6px}
  .input input{width:100%;padding:11px 13px;font-size:16px;border-radius:10px;border:1px solid var(--line);background:#0c1018;color:var(--ink);outline:none}
  .input input:focus{border-color:var(--accent)}
  .err{color:var(--warn);font-size:13px;min-height:18px;margin-bottom:8px}
  .mask{font-family:ui-monospace,Menlo,monospace;letter-spacing:3px}
  .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0 16px;background:#0c1018}
  .card h4{margin:0 0 6px;color:var(--accent);font-size:13px;letter-spacing:.05em}
  .card .row{color:var(--dim);font-size:14px;margin:2px 0}
  .footer{color:var(--dim);font-size:13px;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
  .keys{color:var(--dim);font-size:12px;margin-top:14px;text-align:center}
  .keys b{color:var(--accent);font-weight:600}
  .done{color:var(--accent2);text-align:center;padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="badge">HermesOS first boot · preview</div>
  <div class="frame" id="frame"></div>
  <div class="keys">Navigate: <b>↑ ↓</b> choose · <b>Enter</b> confirm · <b>?</b> help · <b>T</b> plain terminal · <b>Esc</b> back/skip</div>
</div>
<script>
const SCREENS = [{"id":"boot","kind":"info","title":"Hermes","body":["","getting ready…",""],"footer":"Starting up — press Enter when you're ready.","auto":false},{"id":"hello","kind":"info","body":["Hello. I'm going to be your computer's voice.","","Instead of hunting through menus, you'll just tell me","what you want — in normal words — and I'll do it.","","Before anything changes on this machine, I'll always","ask you first and explain what it means.","","Setting up takes about five minutes."],"footer":"Press Enter to begin   ·   (Prefer a normal Linux terminal? Press T.)","escape":"terminal"},{"id":"language","kind":"choice","title":"What language should I speak?","body":["Keyboard layout:  US QWERTY   [detected]","","Type here to test it:  (start typing letters)"],"options":[{"id":"en","label":"English","default":true},{"id":"es","label":"Español"},{"id":"fr","label":"Français"},{"id":"de","label":"Deutsch"},{"id":"ja","label":"日本語"}],"footer":"↑/↓ to choose · Enter to continue · K to pick a keyboard"},{"id":"time","kind":"choice","title":"Where are you?","body":["Detected: London, United Kingdom   (from your network)","","This sets your clock and time zone. Nothing is sent","anywhere — I worked it out from your connection, and","I can be wrong."],"options":[{"id":"detected","label":"London, United Kingdom","default":true},{"id":"other","label":"Somewhere else…"}],"footer":"Enter to accept · ↓ to change"},{"id":"account_name","kind":"text","title":"Let's make your account.","body":["What should I call you?"],"input_label":"Your name (like \"Sam\" or \"Priya\")","footer":"Type your name · Enter to continue","validate":"nonempty"},{"id":"account_password","kind":"password","title":"Nice to meet you.","body":["Now a password. This protects your computer if someone","else picks it up.","","A few normal words strung together — like","\"correct-horse-battery\" — is both easier to remember","and harder to break than \"P@ssw0rd!\"."],"input_label":"Password","footer":"Type a password · Enter to continue","validate":"password","extra_choice":{"id":"encrypt","title":"Should I lock the disk itself?","body":["With this on, someone who steals the machine can't read","your files even by removing the drive. The trade-off:","you'll type a second password at every startup, and if","you forget it, the data is gone forever. No exceptions."],"options":[{"id":"no","label":"No — simpler  (recommended if this machine stays home)","default":true},{"id":"yes","label":"Yes — stronger  (needed if it's a laptop you carry)"}]}},{"id":"brain","kind":"choice","title":"Now the interesting part: choosing my brain.","body":["I run entirely on this computer. Nothing you say goes to","the internet, to me, or to any company. You pick how big","a brain this machine can handle.","","I looked at your hardware:  16 GB memory · 8 cores","","All brains are open-source and free; once downloaded they","work with no internet at all."],"options":[{"id":"balanced","label":"Balanced   ← my recommendation for this machine","default":true,"detail":"Good at most things, comfortably fast here.  4.7 GB · ~6 min"},{"id":"light","label":"Light","detail":"Quicker replies, simpler answers.  2.0 GB · ~3 min"},{"id":"deep","label":"Deep","detail":"Noticeably smarter, slower here. Expect a few seconds' pause.  14 GB · ~18 min"},{"id":"skip","label":"Skip for now — set this up later"}],"footer":"[Enter] choose Balanced   ·   [?] what IS a brain?","help":"A \"brain\" is a language model — a file containing everything I know about language, which runs on this computer's own processor.\n\nBigger brain = better answers, more disk space, slower replies.\nSmaller brain = faster, lighter, a bit more literal.\n\nThe one I recommended is called Qwen 2.5 (7 billion parameters, 4-bit)."},{"id":"download","kind":"progress","title":"Downloading my brain…","body":["████████████████████░░░░░░░░░░  58%","2.7 GB of 4.7 GB · about 3 minutes left","","While that runs, the one thing worth knowing:","","I will never change anything on this computer","without showing you a card first."],"footer":"Download runs in the background · Esc to skip","lesson_card":"approval"},{"id":"first_conversation","kind":"info","title":"Ready. Let's try it once together.","body":["Type this, exactly as written, and press Enter:","","    what's on this computer?","","Then try:","    \"install a web browser\"        ← you'll see an approval card","    \"make my text bigger\"          ← small, instant, reversible","    \"what have you done today?\"    ← read my notebook"],"footer":"Say \"help\" any time · \"!shell\" for a traditional terminal"}];
let i=0,sel=0,typed="",showHelp=false,terminal=false,done=false,errorMsg="";
function render(){
  const f=document.getElementById("frame");
  if(terminal){f.innerHTML='<div class="done">Opened a standard Linux terminal.<br>You can switch back to Hermes any time.</div>';return;}
  if(done){f.innerHTML='<div class="done">Setup complete — you are now using Hermes.<br>Say <b>help</b> any time.</div>';return;}
  const s=SCREENS[i];let html="";
  if(s.title)html+='<div class="title">'+esc(s.title)+"</div>";
  if(s.body)html+='<div class="body">'+esc(s.body.join("\n"))+"</div>";
  if(s.kind==="choice"){
    html+='<ul class="opts">';
    s.options.forEach((o,idx)=>{const c=idx===sel?" class=\"sel\"":"";let d="";if(o.detail)d='<span class=\"d\">'+esc(o.detail)+"</span>";html+="<li"+c+">"+esc(o.label)+d+"</li>";});
    html+="</ul>";
  }
  if(s.kind==="text"||s.kind==="password"){
    const disp=s.kind==="password"?typed.replace(/./g,"•"):typed;
    html+='<div class="input"><label>'+esc(s.input_label||"")+'</label><input id="ti" type="text" value="'+esc(disp)+'" readonly></div><div class="err">'+esc(errorMsg)+"</div>";
  }
  if(s.kind==="progress"){
    html+='<div class="card"><h4>PREVIEW — the approval card you\'ll always see</h4><div class="row">I\'d like to install VLC</div><div class="row">WHAT THIS DOES: Adds a video player to your computer.</div><div class="row">WHAT CHANGES: + 4 new programs (18 MB) · Nothing removed.</div><div class="row">IF YOU CHANGE YOUR MIND: say "undo that".</div></div>';
  }
  if(showHelp&&s.help){html+='<div class="card"><h4>?</h4><div class="row">'+esc(s.help)+"</div></div>";}
  if(s.footer)html+='<div class="footer">'+esc(s.footer)+"</div>";
  f.innerHTML=html;const ti=document.getElementById("ti");if(ti)ti.focus();
}
function esc(t){return (t||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function confirm(){
  const s=SCREENS[i];errorMsg="";
  if((s.kind==="text"||s.kind==="password")){
    if(s.validate==="nonempty"&&!typed.trim()){errorMsg="Please type something — even just a first name.";render();return;}
    if(s.validate==="password"&&typed.length<8){errorMsg="A bit longer, please — 8 characters or more keeps you safe.";render();return;}
  }
  i++;typed="";
  if(i>=SCREENS.length)done=true;
  sel=0;const nxt=SCREENS[i];if(nxt&&nxt.options)nxt.options.forEach((o,idx)=>{if(o.default)sel=idx;});
  render();
}
document.addEventListener("keydown",(e)=>{
  const s=SCREENS[i];
  if(e.key==="ArrowDown"){if(s.kind==="choice"){sel=(sel+1)%s.options.length;render();}e.preventDefault();}
  else if(e.key==="ArrowUp"){if(s.kind==="choice"){sel=(sel-1+s.options.length)%s.options.length;render();}e.preventDefault();}
  else if(e.key==="Enter"){confirm();e.preventDefault();}
  else if(e.key==="?"){showHelp=!showHelp;render();e.preventDefault();}
  else if(e.key==="t"||e.key==="T"){terminal=true;render();e.preventDefault();}
  else if(e.key==="Escape"){if(showHelp){showHelp=false;render();}else{i=Math.max(0,i-1);render();}e.preventDefault();}
  else if(e.key==="Backspace"){typed=typed.slice(0,-1);render();e.preventDefault();}
  else if(e.key.length===1&&(s.kind==="text"||s.kind==="password")){typed+=e.key;render();e.preventDefault();}
});
render();
</script>
</body>
</html>
